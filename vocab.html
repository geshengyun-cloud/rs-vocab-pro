<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabBiz Pro - SM2算法版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.294.0"
        }
    }
    </script>
    <style>
        body { background-color: #f3f4f6; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .perspective-1000 { perspective: 1000px; }
        .no-scrollbar::-webkit-scrollbar { display: none; } 
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { BookOpen, Plus, BarChart3, RotateCcw, Check, X, Brain, Trash2, Home, Volume2, Quote, FileUp, Edit3, Save, AlertTriangle, Download, Search, Image, Globe, Repeat, Zap, AlertCircle } from 'lucide-react';

        // --- 核心种子数据 (SM-2 格式) ---
        const SEED_VOCAB = [
            { id: 1, word: 'Acquisition', definition: 'n. 收购；获得', exEn: 'The acquisition will expand our market share.', exCn: '这次收购将扩大我们的市场份额。', familiarity: 0, nextReview: 0, easeFactor: 2.5, interval: 0, repetitions: 0 },
            { id: 2, word: 'Benchmark', definition: 'n. 基准', exEn: 'This product sets a new benchmark for quality.', exCn: '这款产品树立了新的质量标杆。', familiarity: 0, nextReview: 0, easeFactor: 2.5, interval: 0, repetitions: 0 },
            { id: 3, word: 'Sponsorship', definition: 'n. 赞助；发起', exEn: 'Corporate sponsorship funded the charity event.', exCn: '企业赞助为这次慈善活动提供了资金。', familiarity: 0, nextReview: 0, easeFactor: 2.5, interval: 0, repetitions: 0 },
        ];

        const speakWord = (text) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; 
                window.speechSynthesis.speak(utterance);
            }
        };

        function App() {
            const [view, setView] = useState('home'); 
            const [vocabList, setVocabList] = useState([]);
            const [sessionQueue, setSessionQueue] = useState([]);
            const [currentCardIndex, setCurrentCardIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [sessionStats, setSessionStats] = useState({ correct: 0, total: 0 });
            const [editingWord, setEditingWord] = useState(null); 

            // --- 初始化与数据迁移 ---
            useEffect(() => {
                const savedData = localStorage.getItem('vocab_biz_pro_v4');
                // 兼容旧版本数据 key，如果 v4 没有，尝试读取 v3 或 v2
                const oldData = localStorage.getItem('vocab_biz_pro_data_v3') || localStorage.getItem('vocab_biz_pro_data_v2');
                
                let initialList = [];
                if (savedData) {
                    initialList = JSON.parse(savedData);
                } else if (oldData) {
                    // 🔄 数据迁移：给旧数据加上 SM-2 必须的字段
                    const parsedOld = JSON.parse(oldData);
                    initialList = parsedOld.map(w => ({
                        ...w,
                        easeFactor: w.easeFactor || 2.5, // 默认难度系数
                        interval: w.interval || 0,       // 默认间隔
                        repetitions: w.repetitions || 0  // 默认连续正确数
                    }));
                    alert("检测到旧版数据，已自动升级为 SM-2 算法格式！");
                } else {
                    initialList = SEED_VOCAB;
                }
                setVocabList(initialList);
            }, []);

            useEffect(() => {
                if (vocabList.length > 0) {
                    localStorage.setItem('vocab_biz_pro_v4', JSON.stringify(vocabList));
                }
            }, [vocabList]);

            const startSession = () => {
                const now = Date.now();
                const dueWords = vocabList.filter(word => word.nextReview <= now);
                if (dueWords.length === 0) { alert("太棒了！暂无待复习单词。"); return; }
                const sessionLimit = 30;
                // SM-2 算法里，通常优先复习间隔短的，但为了体验我们还是随机打乱
                const shuffled = [...dueWords].sort(() => Math.random() - 0.5).slice(0, sessionLimit);
                setSessionQueue(shuffled);
                setCurrentCardIndex(0);
                setSessionStats({ correct: 0, total: 0 });
                setIsFlipped(false);
                setView('learn');
                setTimeout(() => speakWord(shuffled[0].word), 500);
            };

            // 🔥 核心升级：SM-2 算法实现
            const handleRating = (grade) => {
                // grade: 0=Again, 1=Hard, 2=Good, 3=Easy
                const currentWord = sessionQueue[currentCardIndex];
                
                // 获取旧参数
                let { easeFactor, repetitions, interval } = currentWord;
                // 防御性编程：确保有默认值
                easeFactor = easeFactor || 2.5;
                repetitions = repetitions || 0;
                interval = interval || 0;

                let nextReviewDate = Date.now();
                
                // 1. 计算新的 SM-2 参数
                if (grade === 0) {
                    // 🔴 Again (重来)
                    repetitions = 0;
                    interval = 0; // 这里的0代表 "<1天"，设为1分钟后
                    // 惩罚 EF 值，让它以后出现更频繁，但最低不低于 1.3
                    easeFactor = Math.max(1.3, easeFactor - 0.2);
                    nextReviewDate += 60 * 1000; // 1分钟后
                } else {
                    // 🟢 答对了 (Hard/Good/Easy)
                    
                    // 更新 EF 值 (标准公式)
                    // Easy(3) -> EF 增加; Good(2) -> EF 不变; Hard(1) -> EF 减少
                    if (grade === 3) easeFactor += 0.15;
                    if (grade === 1) easeFactor = Math.max(1.3, easeFactor - 0.15);

                    // 更新间隔 (Interval) - 单位：天
                    if (repetitions === 0) {
                        interval = 1; // 第一次答对，间隔1天
                    } else if (repetitions === 1) {
                        interval = 6; // 第二次答对，间隔6天
                    } else {
                        // 之后：间隔 = 上次间隔 * EF
                        let modifier = 1;
                        if (grade === 1) modifier = 1.2; // Hard: 增长慢
                        if (grade === 2) modifier = easeFactor; // Good: 正常增长
                        if (grade === 3) modifier = easeFactor * 1.3; // Easy: 飞速增长
                        
                        interval = Math.ceil(interval * modifier);
                    }
                    repetitions += 1;
                    nextReviewDate += interval * 24 * 60 * 60 * 1000; // 转换为毫秒
                }

                // 2. 更新单词列表
                const updatedList = vocabList.map(w => 
                    w.id === currentWord.id 
                        ? { ...w, nextReview: nextReviewDate, easeFactor, interval, repetitions } 
                        : w
                );
                setVocabList(updatedList);

                // 3. 更新统计
                setSessionStats(prev => ({ 
                    correct: grade >= 2 ? prev.correct + 1 : prev.correct, 
                    total: prev.total + 1 
                }));

                // 4. 切换下一张
                if (currentCardIndex < sessionQueue.length - 1) {
                    setIsFlipped(false);
                    setTimeout(() => {
                        setCurrentCardIndex(prev => prev + 1);
                        speakWord(sessionQueue[currentCardIndex + 1].word);
                    }, 200);
                } else {
                    setView('summary');
                }
            };

            // --- 增删改查 (保持不变) ---
            const handleSaveWord = (wordData) => {
                if (editingWord) {
                    setVocabList(prev => prev.map(w => w.id === editingWord.id ? { ...w, ...wordData } : w));
                    setEditingWord(null);
                    alert("修改成功！");
                } else {
                    // 新词默认参数
                    const newWord = { id: Date.now(), ...wordData, easeFactor: 2.5, interval: 0, repetitions: 0, nextReview: 0 };
                    setVocabList(prev => [...prev, newWord]);
                }
                setView('stats'); 
            };

            const handleDelete = (id) => { if(confirm('确定删除？')) setVocabList(prev => prev.filter(w => w.id !== id)); };
            const startEdit = (word) => { setEditingWord(word); setView('add'); };
            const handleResetAll = () => {
                if (prompt("⚠️ 确认清空请输入 'RESET'") === 'RESET') {
                    setVocabList([]); localStorage.setItem('vocab_biz_pro_v4', JSON.stringify([])); alert("已清空");
                }
            };

            const handleImport = (text) => {
                if(!text) return;
                const lines = text.split('\n');
                const newWords = [];
                lines.forEach(line => {
                    if(!line.trim()) return;
                    let w, d, en = "", cn = "";
                    if (line.includes('\t')) {
                        const parts = line.split('\t');
                        w = parts[0]?.trim(); d = parts[1]?.trim(); en = parts[2]?.trim()||""; cn = parts[3]?.trim()||"";
                    } else {
                        const parts = line.split(/[,，]/);
                        w = parts[0]?.trim(); d = parts[1]?.trim(); 
                        if (parts.length > 2) en = parts[2].trim(); if (parts.length > 3) cn = parts.slice(3).join(',').trim();
                    }
                    if(w && d) newWords.push({ 
                        id: Date.now() + Math.random(), word: w, definition: d, exEn: en, exCn: cn, 
                        easeFactor: 2.5, interval: 0, repetitions: 0, nextReview: 0 
                    });
                });
                if(newWords.length > 0) { setVocabList(prev => [...prev, ...newWords]); alert(`导入 ${newWords.length} 个单词`); setView('stats'); }
            };

            const handleExport = () => {
                if(vocabList.length === 0) { alert("无内容"); return; }
                let content = "单词\t释义\t英文例句\t中文例句\n";
                vocabList.forEach(item => {
                    const clean = (s) => s ? s.replace(/[\r\n\t]/g, " ") : "";
                    content += `${clean(item.word)}\t${clean(item.definition)}\t${clean(item.exEn)}\t${clean(item.exCn)}\n`;
                });
                const blob = new Blob(['\uFEFF' + content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `VocabBiz_SM2_${new Date().toISOString().slice(0,10)}.txt`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            };

            const openSearch = (word, type) => {
                let url = "";
                if (type === 'bing') url = `https://cn.bing.com/dict/search?q=${encodeURIComponent(word)}`;
                else if (type === 'images') url = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(word + " business concept")}`;
                else if (type === 'wiki') url = `https://en.wikipedia.org/wiki/${encodeURIComponent(word)}`;
                window.open(url, '_blank');
            };

            // --- 视图 ---
            const HomeView = () => {
                const dueCount = vocabList.filter(w => w.nextReview <= Date.now()).length;
                return (
                    <div className="flex flex-col items-center p-6 h-full max-w-md mx-auto relative pt-12 overflow-y-auto">
                        <div className="mb-8 text-center">
                            <div className="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg rotate-3">
                                <BookOpen size={40} className="text-white -rotate-3" />
                            </div>
                            <h1 className="text-2xl font-extrabold text-gray-800 tracking-tight">VocabBiz <span className="text-indigo-600">Pro</span></h1>
                            <p className="text-xs text-indigo-400 font-bold tracking-wider mt-1 uppercase">Powered by SM-2 Algorithm</p>
                        </div>
                        <button onClick={startSession} className="w-full bg-indigo-600 text-white p-6 rounded-2xl shadow-xl shadow-indigo-200 mb-6 flex justify-between items-center transition hover:scale-[1.02] active:scale-95 group">
                            <div className="text-left">
                                <div className="text-indigo-200 text-xs font-bold uppercase tracking-wider mb-1">今日待复习</div>
                                <div className="text-4xl font-bold group-hover:translate-x-1 transition">{dueCount}</div>
                            </div>
                            <RotateCcw size={32} className="opacity-80 group-hover:rotate-180 transition duration-500"/>
                        </button>
                        <div className="grid grid-cols-2 gap-4 w-full mb-6">
                            <button onClick={() => { setEditingWord(null); setView('add'); }} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 hover:bg-gray-50 active:scale-95 transition"><div className="p-2 bg-green-100 text-green-600 rounded-full"><Plus size={20}/></div><span className="text-sm font-bold text-gray-700">添加单词</span></button>
                            <button onClick={() => setView('import')} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 hover:bg-gray-50 active:scale-95 transition"><div className="p-2 bg-blue-100 text-blue-600 rounded-full"><FileUp size={20}/></div><span className="text-sm font-bold text-gray-700">导入新词</span></button>
                            <button onClick={handleExport} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 hover:bg-gray-50 active:scale-95 transition"><div className="p-2 bg-purple-100 text-purple-600 rounded-full"><Download size={20}/></div><span className="text-sm font-bold text-gray-700">导出备份</span></button>
                            <button onClick={() => setView('stats')} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 hover:bg-gray-50 active:scale-95 transition"><div className="p-2 bg-orange-100 text-orange-600 rounded-full"><BarChart3 size={20}/></div><span className="text-sm font-bold text-gray-700">管理词表</span></button>
                        </div>
                        <div className="mt-auto pt-8 border-t border-gray-200 w-full"><button onClick={handleResetAll} className="w-full text-xs text-red-400 hover:text-red-600 py-2 flex items-center justify-center gap-1 opacity-60 hover:opacity-100 transition"><AlertTriangle size={12} /> 一键清空</button></div>
                    </div>
                );
            };

            const LearnView = () => {
                const card = sessionQueue[currentCardIndex];
                if (!card) return null;
                return (
                    <div className="h-full flex flex-col p-6 max-w-md mx-auto">
                        <div className="flex justify-end mb-4"><button onClick={() => setView('home')} className="text-gray-400 flex items-center gap-1 text-sm font-medium hover:text-gray-600"><Home size={16}/> 退出</button></div>
                        <div className="flex-1 perspective-1000 group cursor-pointer" onClick={() => setIsFlipped(!isFlipped)}>
                            <div className={`relative w-full h-full transition-all duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                                <div className="absolute inset-0 backface-hidden bg-white border-2 border-indigo-50 rounded-3xl shadow-xl flex flex-col items-center justify-center p-8 text-center">
                                    <h2 className="text-4xl font-extrabold text-gray-800 mb-8 break-words w-full">{card.word}</h2>
                                    <button onClick={(e) => { e.stopPropagation(); speakWord(card.word); }} className="p-4 bg-indigo-50 text-indigo-600 rounded-full mb-8 hover:scale-110 hover:bg-indigo-100 transition shadow-sm"><Volume2 size={28}/></button>
                                    <p className="text-indigo-300 text-xs font-bold tracking-widest uppercase animate-pulse">Tap to Flip</p>
                                </div>
                                <div className="absolute inset-0 backface-hidden rotate-y-180 bg-indigo-50 rounded-3xl overflow-hidden flex flex-col border-2 border-indigo-100">
                                    <div className="flex-1 overflow-y-auto p-6 flex flex-col items-center justify-center">
                                        <div className="text-2xl font-bold mb-2 text-gray-800">{card.word}</div>
                                        <div className="text-xl text-gray-600 font-medium text-center mb-6 pb-4 border-b border-indigo-200 w-full">{card.definition}</div>
                                        {(card.exEn || card.exCn) ? (
                                            <div className="bg-white shadow-sm border border-indigo-100 p-5 rounded-xl text-sm w-full text-left mb-6">
                                                <div className="flex gap-2 mb-3 text-indigo-500 font-bold text-xs uppercase items-center"><Quote size={14}/> Example</div>
                                                {card.exEn && <div className="mb-2 text-gray-800 leading-relaxed font-medium text-base">{card.exEn}</div>}
                                                {card.exCn && <div className="text-gray-500 text-sm">{card.exCn}</div>}
                                            </div>
                                        ) : <div className="text-gray-400 text-xs italic mb-6">暂无例句</div>}
                                        <div className="flex gap-3 justify-center w-full">
                                            <button onClick={(e) => {e.stopPropagation(); openSearch(card.word, 'bing')}} className="flex flex-col items-center gap-1 text-gray-400 hover:text-blue-600 transition p-2 hover:bg-blue-50 rounded-lg"><Search size={20}/><span className="text-[10px] font-bold">必应</span></button>
                                            <button onClick={(e) => {e.stopPropagation(); openSearch(card.word, 'images')}} className="flex flex-col items-center gap-1 text-gray-400 hover:text-pink-600 transition p-2 hover:bg-pink-50 rounded-lg"><Image size={20}/><span className="text-[10px] font-bold">搜图</span></button>
                                            <button onClick={(e) => {e.stopPropagation(); openSearch(card.word, 'wiki')}} className="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-800 transition p-2 hover:bg-gray-200 rounded-lg"><Globe size={20}/><span className="text-[10px] font-bold">百科</span></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 🚀 SM-2 四档按钮 */}
                        <div className={`mt-6 grid grid-cols-4 gap-2 transition-all duration-300 transform ${isFlipped ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                            
                            <button onClick={(e) => {e.stopPropagation(); handleRating(0)}} className="flex flex-col items-center justify-center p-3 rounded-xl bg-red-50 text-red-500 border border-red-100 hover:bg-red-100 active:scale-95 transition">
                                <Repeat size={20} className="mb-1"/>
                                <span className="text-[10px] font-bold">重来</span>
                            </button>

                            <button onClick={(e) => {e.stopPropagation(); handleRating(1)}} className="flex flex-col items-center justify-center p-3 rounded-xl bg-orange-50 text-orange-600 border border-orange-100 hover:bg-orange-100 active:scale-95 transition">
                                <AlertCircle size={20} className="mb-1"/>
                                <span className="text-[10px] font-bold">困难</span>
                            </button>

                            <button onClick={(e) => {e.stopPropagation(); handleRating(2)}} className="flex flex-col items-center justify-center p-3 rounded-xl bg-blue-50 text-blue-600 border border-blue-100 hover:bg-blue-100 active:scale-95 transition">
                                <Check size={20} className="mb-1"/>
                                <span className="text-[10px] font-bold">一般</span>
                            </button>

                            <button onClick={(e) => {e.stopPropagation(); handleRating(3)}} className="flex flex-col items-center justify-center p-3 rounded-xl bg-green-50 text-green-600 border border-green-100 hover:bg-green-100 active:scale-95 transition">
                                <Zap size={20} className="mb-1"/>
                                <span className="text-[10px] font-bold">简单</span>
                            </button>

                        </div>
                    </div>
                );
            };

            const AddEditView = () => {
                const [w, setW] = useState(editingWord ? editingWord.word : '');
                const [d, setD] = useState(editingWord ? editingWord.definition : '');
                const [en, setEn] = useState(editingWord ? editingWord.exEn || '' : '');
                const [cn, setCn] = useState(editingWord ? editingWord.exCn || '' : '');
                return (
                    <div className="p-6 h-full flex flex-col max-w-md mx-auto pt-8 bg-white">
                        <h2 className="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                            {editingWord ? <Edit3 className="text-indigo-600"/> : <Plus className="text-green-600"/>}
                            {editingWord ? '修改单词' : '添加新单词'}
                        </h2>
                        <div className="flex-1 overflow-y-auto space-y-4 no-scrollbar">
                            <div><label className="block text-xs font-bold text-gray-400 uppercase mb-1">Word</label><input className="w-full p-4 border bg-gray-50 rounded-xl text-lg font-bold text-gray-800 focus:border-indigo-500 outline-none" placeholder="单词" value={w} onChange={e=>setW(e.target.value)}/></div>
                            <div><label className="block text-xs font-bold text-gray-400 uppercase mb-1">Definition</label><input className="w-full p-4 border bg-gray-50 rounded-xl text-base text-gray-800 focus:border-indigo-500 outline-none" placeholder="中文释义" value={d} onChange={e=>setD(e.target.value)}/></div>
                            <div className="p-4 border border-dashed border-gray-300 rounded-xl bg-gray-50/50">
                                <label className="block text-xs font-bold text-gray-400 uppercase mb-2">Example (Optional)</label>
                                <textarea className="w-full p-3 border rounded-lg text-sm mb-2 focus:border-indigo-500 outline-none resize-none h-20" placeholder="English Example..." value={en} onChange={e=>setEn(e.target.value)}/>
                                <input className="w-full p-3 border rounded-lg text-sm focus:border-indigo-500 outline-none" placeholder="例句中文翻译..." value={cn} onChange={e=>setCn(e.target.value)}/>
                            </div>
                        </div>
                        <div className="flex gap-3 mt-4 pt-4 border-t">
                            <button onClick={()=>setView('home')} className="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-gray-500 hover:bg-gray-200 transition">取消</button>
                            <button onClick={()=>w && d && handleSaveWord({word:w, definition:d, exEn:en, exCn:cn})} disabled={!w||!d} className="flex-1 py-3 bg-indigo-600 rounded-xl font-bold text-white hover:bg-indigo-700 disabled:opacity-50 transition flex items-center justify-center gap-2"><Save size={18}/> {editingWord ? '更新' : '保存'}</button>
                        </div>
                    </div>
                );
            };

            const ImportView = () => {
                const [txt, setTxt] = useState('');
                return (
                    <div className="p-6 h-full flex flex-col max-w-md mx-auto pt-8">
                        <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2"><FileUp/> 批量导入</h2>
                        <div className="bg-indigo-50 text-indigo-800 p-4 rounded-xl text-xs mb-4 leading-relaxed"><p className="font-bold mb-2">📥 推荐导入格式 (Excel 复制):</p><div className="flex gap-2 mb-1"><span className="bg-white px-2 py-1 rounded border">单词</span><span className="bg-white px-2 py-1 rounded border">释义</span><span className="bg-white px-2 py-1 rounded border">英文例句</span><span className="bg-white px-2 py-1 rounded border">中文翻译</span></div></div>
                        <textarea className="flex-1 p-4 border-2 border-gray-200 rounded-xl font-mono text-sm mb-4 focus:border-indigo-500 outline-none resize-none" placeholder={`Acquisition	收购	The firm announced it.	公司宣布了。\n\nWord, 释义, En Example, Cn Example`} value={txt} onChange={e=>setTxt(e.target.value)}></textarea>
                        <div className="flex gap-3"><button onClick={()=>setView('home')} className="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-gray-600">取消</button><button onClick={()=>handleImport(txt)} disabled={!txt} className="flex-1 py-3 bg-indigo-600 rounded-xl font-bold text-white disabled:opacity-50">开始导入</button></div>
                    </div>
                );
            };

            const StatsView = () => (
                <div className="p-6 h-full flex flex-col max-w-md mx-auto">
                     <div className="flex items-center justify-between mb-6"><h2 className="text-xl font-bold text-gray-800">词汇管理 ({vocabList.length})</h2><button onClick={()=>setView('home')} className="p-2 bg-gray-200 rounded-full hover:bg-gray-300 transition"><X size={20}/></button></div>
                     <div className="flex-1 overflow-y-auto space-y-3 pb-20 no-scrollbar">
                        {vocabList.map(item => (
                            <div key={item.id} className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex justify-between items-start group hover:border-indigo-200 transition">
                                <div className="flex-1 pr-2">
                                    <div className="font-bold text-gray-800 text-lg">{item.word}</div>
                                    <div className="text-sm text-gray-600">{item.definition}</div>
                                    <div className="flex items-center gap-2 mt-2">
                                        <span className={`text-[10px] px-1.5 py-0.5 rounded ${item.easeFactor >= 2.5 ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>EF: {item.easeFactor.toFixed(2)}</span>
                                        <span className="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">Interval: {item.interval}d</span>
                                    </div>
                                </div>
                                <div className="flex gap-1"><button onClick={() => startEdit(item)} className="text-gray-300 hover:text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg transition" title="编辑"><Edit3 size={18}/></button><button onClick={() => handleDelete(item.id)} className="text-gray-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition" title="删除"><Trash2 size={18}/></button></div>
                            </div>
                        ))}
                     </div>
                </div>
            );
            
            const SummaryView = () => (
                <div className="h-full flex flex-col items-center justify-center p-6 bg-white">
                    <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-6 animate-bounce"><Check size={40} /></div>
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">Session Complete!</h2>
                    <button onClick={() => setView('home')} className="w-full max-w-xs py-4 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200 transition">Back to Home</button>
                </div>
            );

            return (
                <div className="h-screen w-full overflow-hidden bg-gray-50 font-sans">
                    {view === 'home' && <HomeView />} {view === 'learn' && <LearnView />} {view === 'add' && <AddEditView />}
                    {view === 'import' && <ImportView />} {view === 'stats' && <StatsView />} {view === 'summary' && <SummaryView />}
                </div>
            );
        }
        
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
